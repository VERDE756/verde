<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verde 2</title>

    <style>
        :root {
            --verde: #39ff72;
            --verde-claro: #8affaa;
            --verde-escuro: #0d6b2d;

            --fundo: #050a07;
            --fundo-2: #07100a;

            --painel: #0a160d;
            --painel-2: #0d1d12;

            --borda: #1a4f2a;
            --borda-hover: #2c7f43;

            --texto: #e6ffeb;
            --texto-fraco: #7fa88a;

            --vermelho: #ff5c5c;

            --sombra:
                0 20px 50px rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
            background: var(--fundo);
        }

        body {
            min-height: 100vh;

            color: var(--texto);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at 10% 0%,
                    rgba(57, 255, 114, 0.10),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 100% 100%,
                    rgba(57, 255, 114, 0.05),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #050a07,
                    #020603
                );

            overflow-x: hidden;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        ::selection {
            background: var(--verde);
            color: #021006;
        }

        /* =========================================
           APP
        ========================================= */

        #app {
            width: min(1400px, calc(100% - 28px));

            min-height: calc(100vh - 28px);

            margin: 14px auto;

            display: grid;

            grid-template-columns: 290px minmax(0, 1fr);

            background:
                rgba(7, 17, 10, 0.92);

            border:
                1px solid var(--borda);

            box-shadow:
                var(--sombra);

            overflow: hidden;
        }

        /* =========================================
           SIDEBAR
        ========================================= */

        #sidebar {
            min-width: 0;

            display: flex;
            flex-direction: column;

            padding: 18px;

            background:
                linear-gradient(
                    180deg,
                    #09170d,
                    #061009
                );

            border-right:
                1px solid var(--borda);
        }

        .logo {
            margin-bottom: 18px;

            color: var(--verde);

            font-size: 25px;
            font-weight: 900;

            letter-spacing: 6px;

            text-shadow:
                0 0 18px rgba(57, 255, 114, 0.25);
        }

        .logo-sub {
            margin-top: -11px;
            margin-bottom: 18px;

            color: var(--texto-fraco);

            font-size: 10px;

            letter-spacing: 2px;
        }

        .novo-btn {
            width: 100%;

            padding: 12px 14px;

            margin-bottom: 10px;

            background:
                linear-gradient(
                    135deg,
                    #0e4b21,
                    #0b2c16
                );

            color: var(--verde-claro);

            border:
                1px solid #28783e;

            border-radius: 8px;

            font-weight: 800;

            transition: 0.18s ease;
        }

        .novo-btn:hover {
            background:
                linear-gradient(
                    135deg,
                    #155c2a,
                    #0e3b1c
                );

            border-color:
                var(--verde);

            transform:
                translateY(-1px);

            box-shadow:
                0 0 18px
                rgba(57, 255, 114, 0.12);
        }

        #pesquisa {
            width: 100%;

            padding: 11px 12px;

            margin-bottom: 12px;

            background: #041008;

            color: var(--texto);

            border:
                1px solid var(--borda);

            border-radius: 8px;

            outline: none;
        }

        #pesquisa:focus {
            border-color:
                var(--verde);

            box-shadow:
                0 0 14px
                rgba(57, 255, 114, 0.07);
        }

        #pesquisa::placeholder {
            color:
                #53725c;
        }

        #lista-notas {
            flex: 1;

            min-height: 0;

            overflow-y: auto;

            padding-right: 3px;
        }

        .nota-item {
            padding: 12px;

            margin-bottom: 8px;

            background:
                #09170e;

            border:
                1px solid #163e22;

            border-radius: 8px;

            cursor: pointer;

            transition: 0.15s ease;
        }

        .nota-item:hover {
            background:
                #0d2414;

            border-color:
                var(--borda-hover);

            transform:
                translateX(2px);
        }

        .nota-item.ativa {
            background:
                linear-gradient(
                    135deg,
                    #10361b,
                    #0c2414
                );

            border-color:
                var(--verde);

            box-shadow:
                inset 3px 0 0 var(--verde);
        }

        .nota-item-titulo {
            display: block;

            margin-bottom: 5px;

            color:
                #c8f6d2;

            font-size: 13px;
            font-weight: 800;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nota-item-resumo {
            display: block;

            color:
                #6f8f76;

            font-size: 11px;

            line-height: 1.4;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nota-item-meta {
            margin-top: 6px;

            color:
                #49654f;

            font-size: 9px;
        }

        .lista-vazia {
            padding: 20px 10px;

            color:
                #57745e;

            text-align: center;

            font-size: 11px;
        }

        /* =========================================
           CONTEÚDO
        ========================================= */

        #conteudo {
            min-width: 0;
            min-height: 0;

            display: flex;
            flex-direction: column;

            padding: 20px;
        }

        #topo-editor {
            display: flex;

            gap: 10px;

            margin-bottom: 10px;
        }

        #titulo {
            flex: 1;

            min-width: 0;

            padding: 14px 16px;

            background:
                #07140b;

            color:
                var(--verde-claro);

            border:
                1px solid var(--borda);

            border-radius: 9px;

            outline: none;

            font-size: 21px;
            font-weight: 800;
        }

        #titulo:focus {
            border-color:
                var(--verde);

            box-shadow:
                0 0 14px
                rgba(57, 255, 114, 0.06);
        }

        #titulo::placeholder {
            color:
                #4f7057;
        }

        .topo-btn {
            width: 44px;
            height: 44px;

            border:
                1px solid var(--borda);

            border-radius: 8px;

            background:
                #0a1b0f;

            color:
                var(--verde-claro);

            font-size: 18px;

            transition: 0.15s ease;
        }

        .topo-btn:hover {
            border-color:
                var(--verde);

            background:
                #11351b;

            transform:
                translateY(-1px);
        }

        /* =========================================
           TOOLBAR
        ========================================= */

        #toolbar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;

            gap: 5px;

            padding: 8px;

            margin-bottom: 10px;

            background:
                #07130b;

            border:
                1px solid var(--borda);

            border-radius: 8px;
        }

        .tool {
            min-width: 34px;
            height: 31px;

            padding: 0 9px;

            background:
                #0a1a0f;

            color:
                #c5efd0;

            border:
                1px solid #174526;

            border-radius: 6px;

            font-size: 11px;
            font-weight: 800;

            transition: 0.15s ease;
        }

        .tool:hover {
            background:
                #12331a;

            border-color:
                var(--borda-hover);

            color:
                var(--verde-claro);
        }

        .tool.active {
            background:
                #12441f;

            border-color:
                var(--verde);

            color:
                var(--verde);
        }

        .separador {
            width: 1px;
            height: 20px;

            margin: 0 2px;

            background:
                #1a4725;
        }

        /* =========================================
           EDITOR
        ========================================= */

        #editor {
            flex: 1;

            min-height: 380px;

            overflow-y: auto;

            padding: 25px 27px;

            background:
                linear-gradient(
                    145deg,
                    #0a190e,
                    #08140b
                );

            border:
                1px solid var(--borda);

            border-radius: 10px;

            outline: none;

            color:
                #eaffef;

            font-size: 15px;

            line-height: 1.75;

            box-shadow:
                inset 0 1px 0
                rgba(255,255,255,0.02);
        }

        #editor:focus {
            border-color:
                #296e3b;
        }

        #editor:empty::before {
            content:
                "Comece a escrever...";
            color:
                #4f7057;
        }

        #editor p {
            margin: 0 0 12px;
        }

        #editor h1 {
            margin: 10px 0;

            color:
                var(--verde);

            font-size: 31px;
        }

        #editor h2 {
            margin: 10px 0;

            color:
                var(--verde-claro);

            font-size: 24px;
        }

        #editor h3 {
            margin: 10px 0;

            color:
                #c4ffd1;

            font-size: 19px;
        }

        #editor blockquote {
            margin: 14px 0;

            padding: 10px 14px;

            background:
                rgba(57, 255, 114, 0.04);

            border-left:
                3px solid var(--verde);

            color:
                #9abb9f;
        }

        #editor ul,
        #editor ol {
            padding-left: 28px;
        }

        #editor a {
            color:
                #6bff95;
        }

        #editor img {
            display: block;

            max-width: 100%;
            height: auto;

            margin: 15px 0;

            border:
                1px solid #2a7840;

            border-radius: 8px;

            box-shadow:
                0 10px 28px
                rgba(0,0,0,0.28);
        }

        /* =========================================
           RODAPÉ
        ========================================= */

        #rodape {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            padding-top: 10px;
        }

        #info {
            display: flex;
            flex-wrap: wrap;

            gap: 12px;

            color:
                #587660;

            font-size: 10px;
        }

        #info strong {
            color:
                #8eb798;
        }

        #status-salvar {
            color:
                #69876f;

            font-size: 10px;
        }

        #acoes {
            display: flex;

            gap: 7px;
        }

        .acao {
            padding:
                10px 14px;

            border-radius:
                7px;
        }

        #anexar {
            background:
                #0a2512;

            border-color:
                #236938;

            color:
                #a7efb8;
        }

        #anexar:hover {
            border-color:
                var(--verde);
        }

        #salvar {
            background:
                linear-gradient(
                    135deg,
                    #0d5b27,
                    #0a3519
                );

            border-color:
                #31a84f;

            color:
                #c1ffd0;
        }

        #salvar:hover {
            box-shadow:
                0 0 18px
                rgba(57,255,114,0.16);
        }

        #excluir {
            background:
                #251010;

            border-color:
                #612a2a;

            color:
                #ffaaaa;
        }

        #excluir:hover {
            background:
                #3a1515;

            border-color:
                var(--vermelho);

            color:
                #ffd0d0;
        }

        #input-imagem {
            display: none;
        }

        /* =========================================
           SCROLLBAR
        ========================================= */

        ::-webkit-scrollbar {
            width: 9px;
        }

        ::-webkit-scrollbar-track {
            background:
                #030805;
        }

        ::-webkit-scrollbar-thumb {
            background:
                #165528;

            border-radius:
                10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background:
                var(--verde);
        }

        /* =========================================
           RESPONSIVO
        ========================================= */

        @media (max-width: 850px) {

            #app {
                grid-template-columns:
                    1fr;

                grid-template-rows:
                    auto auto;

                min-height:
                    auto;
            }

            #sidebar {
                border-right:
                    none;

                border-bottom:
                    1px solid var(--borda);
            }

            #lista-notas {
                max-height:
                    220px;
            }

            #conteudo {
                min-height:
                    650px;
            }

        }

        @media (max-width: 600px) {

            #app {
                width:
                    calc(100% - 12px);

                margin:
                    6px auto;
            }

            #conteudo {
                padding:
                    12px;
            }

            #topo-editor {
                flex-wrap:
                    wrap;
            }

            #titulo {
                width:
                    100%;
            }

            #toolbar {
                gap:
                    3px;
            }

            #rodape {
                align-items:
                    stretch;

                flex-direction:
                    column;
            }

            #acoes {
                width:
                    100%;
            }

            .acao {
                flex:
                    1;
            }
        }
    </style>
</head>

<body>

    <div id="app">

        <aside id="sidebar">

            <div class="logo">
                VERDE
            </div>

            <div class="logo-sub">
                ANOTAÇÕES
            </div>

            <button
                class="novo-btn"
                id="nova-nota"
            >
                + NOVA ANOTAÇÃO
            </button>

            <input
                id="pesquisa"
                type="text"
                placeholder="Pesquisar..."
                autocomplete="off"
            >

            <div id="lista-notas"></div>

        </aside>


        <main id="conteudo">

            <div id="topo-editor">

                <input
                    id="titulo"
                    type="text"
                    placeholder="Título da anotação"
                    autocomplete="off"
                >

                <button
                    class="topo-btn"
                    id="duplicar-nota"
                    title="Duplicar anotação"
                >
                    =
                </button>

            </div>


            <div id="toolbar">

                <button
                    class="tool"
                    data-comando="bold"
                    title="Negrito"
                >
                    B
                </button>

                <button
                    class="tool"
                    data-comando="italic"
                    title="Itálico"
                >
                    I
                </button>

                <button
                    class="tool"
                    data-comando="underline"
                    title="Sublinhado"
                >
                    U
                </button>

                <div class="separador"></div>

                <button
                    class="tool"
                    data-bloco="h1"
                >
                    H1
                </button>

                <button
                    class="tool"
                    data-bloco="h2"
                >
                    H2
                </button>

                <button
                    class="tool"
                    data-bloco="h3"
                >
                    H3
                </button>

                <button
                    class="tool"
                    data-bloco="p"
                >
                    P
                </button>

                <div class="separador"></div>

                <button
                    class="tool"
                    data-comando="insertUnorderedList"
                    title="Lista"
                >
                    •
                </button>

                <button
                    class="tool"
                    data-comando="insertOrderedList"
                    title="Lista numerada"
                >
                    1.
                </button>

                <button
                    class="tool"
                    data-comando="justifyLeft"
                    title="Esquerda"
                >
                    L
                </button>

                <button
                    class="tool"
                    data-comando="justifyCenter"
                    title="Centro"
                >
                    C
                </button>

                <button
                    class="tool"
                    data-comando="justifyRight"
                    title="Direita"
                >
                    R
                </button>

                <div class="separador"></div>

                <button
                    class="tool"
                    id="link-btn"
                >
                    LINK
                </button>

                <button
                    class="tool"
                    id="data-btn"
                >
                    DATA
                </button>

                <button
                    class="tool"
                    data-comando="removeFormat"
                >
                    LIMPAR
                </button>

            </div>


            <div
                id="editor"
                contenteditable="true"
                spellcheck="true"
            ></div>


            <div id="rodape">

                <div id="info">

                    <span>
                        PALAVRAS:
                        <strong id="palavras">
                            0
                        </strong>
                    </span>

                    <span>
                        CARACTERES:
                        <strong id="caracteres">
                            0
                        </strong>
                    </span>

                    <span>
                        IMAGENS:
                        <strong id="imagens">
                            0
                        </strong>
                    </span>

                </div>


                <div id="status-salvar">
                    Tudo salvo
                </div>


                <div id="acoes">

                    <button
                        class="acao"
                        id="anexar"
                    >
                        ANEXAR IMAGEM
                    </button>

                    <button
                        class="acao"
                        id="salvar"
                    >
                        SALVAR
                    </button>

                    <button
                        class="acao"
                        id="excluir"
                    >
                        EXCLUIR
                    </button>

                    <input
                        id="input-imagem"
                        type="file"
                        accept="image/*"
                    >

                </div>

            </div>

        </main>

    </div>


    <script src="verde2.js"></script>

</body>
</html>
